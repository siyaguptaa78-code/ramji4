<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#040914"/>
  <text x="40" y="45" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#38bdf8">Retention Slab Cost vs Open Market Valuation</text>
  <text x="40" y="70" font-family="'Poppins', sans-serif" font-size="13" fill="#94a3b8">Evaluating whether retaining top players at fixed slabs outperforms auction inflation.</text>

  <rect x="40" y="100" width="345" height="200" rx="8" fill="#0c1d38" stroke="#38bdf8"/>
  <text x="60" y="135" font-family="'Montserrat', sans-serif" font-weight="700" font-size="15" fill="#38bdf8">RETENTION SLAB #1: ₹18 CR</text>
  <text x="60" y="170" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Fixed deduction from auction purse</text>
  <text x="60" y="200" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Eliminates auction bidding war risk</text>
  <text x="60" y="230" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Player retention value: High brand continuity</text>
  <text x="60" y="270" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#10b981">Definite Value for Top 5 Global T20 Assets</text>

  <rect x="415" y="100" width="345" height="200" rx="8" fill="#0c1d38" stroke="#f59e0b"/>
  <text x="435" y="135" font-family="'Montserrat', sans-serif" font-weight="700" font-size="15" fill="#fbbf24">AUCTION OPEN MARKET REALITY</text>
  <text x="435" y="170" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Star pace bowlers reach ₹20 Cr - ₹24 Cr</text>
  <text x="435" y="200" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Inflation penalty when 3+ teams have purse</text>
  <text x="435" y="230" font-family="'Poppins', sans-serif" font-size="13" fill="#bae6fd">• Can cripple remainder of squad auction</text>
  <text x="435" y="270" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#fbbf24">Franchises must retain 3-4 players minimum</text>
</svg>